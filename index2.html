  <script>

    const cursorAnimation = document.querySelector(".cursor");
    const cursors = document.querySelectorAll(".cursor");

    document.addEventListener("click", (e) => {
      let x = e.clientX;
      let y = e.clientY;

      cursorAnimation.style.top = y + "px";
      cursorAnimation.style.left = x + "px";

      cursors.forEach((cursor) => {
        cursor.classList.add("active");


        function removeCursorActive() {
          cursor.classList.remove("active");
        }
        setTimeout(removeCursorActive, 1000);
      });

      let cursorClone = cursorAnimation.cloneNode(true);
      document.querySelector("body").appendChild(cursorClone);

      setTimeout(() => {
        cursorClone.remove();
      }, 1000);
    });

  </script>

<script>
  const form = document.forms['submit-to-google-sheet'];
  const msg = document.getElementById("form-msg");

  form.addEventListener('submit', e => {
    e.preventDefault();
    msg.innerHTML = "Submitting...";

    fetch("https://formsubmit.co/ajax/srivastavishan82@gmail.com", {
        method: "POST",
        headers: { 
            'Accept': 'application/json'
        },
        body: new FormData(form)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            msg.innerHTML = "Registration successful! (First time? Check your email to Activate!)";
            form.reset();
        } else {
            msg.innerHTML = "Error submitting form. Please try again.";
        }
        setTimeout(function(){
            msg.innerHTML = "";
        }, 8000);
    })
    .catch(error => {
        console.error('Error!', error.message);
        msg.innerHTML = "Error submitting form. Please try again.";
        setTimeout(function(){
            msg.innerHTML = "";
        }, 5000);
    });
  });
</script>
